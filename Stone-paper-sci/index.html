<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Stone Paper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Stone-Paper-Scissor</h1>
    <h2>Level-0</h2>
    <div class="button-box">
    <button class="btn btn1" id="stone"><i class="fa-solid fa-hand-fist" ></i></button>
    <button class="btn btn2" id="paper"><i class="fa-solid fa-hand"></i></button>
    <button class="btn btn3" id="scissor"><i class="fa-solid fa-hand-peace"></i></button>
    </div>
    <div class="score-box">
    <div class="score user">0 You </div>
    <div class="score computer">0 Computer</div>
    </div>


    <script src="script.js"></script>
</body>
</html>
